<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Databricks Certified Data Engineer Associate — Practice Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#16213a; --text:#e5e9f0; --muted:#94a3b8;
    --accent:#3b82f6; --accent2:#8b5cf6; --border:#2d3b55;
    --correct-bg:#86efac; --correct-bg2:#22c55e; --incorrect-bg:#fca5a5;
    --correct-text:#064e21; --incorrect-text:#7f1d1d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#0f172a,#1a2440 60%,#0f172a); color:var(--text); min-height:100vh;
  }
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 60px;}
  header{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    padding:18px 22px; background:var(--panel); border:1px solid var(--border); border-radius:14px; margin-bottom:20px;
    position:sticky; top:10px; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  header h1{font-size:16px; margin:0; font-weight:600; color:#fff;}
  header .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .stat{
    display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--border);
    padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600;
  }
  .stat .icon{font-size:15px;}
  #timer{font-variant-numeric:tabular-nums; color:#fbbf24;}
  #scoreStat{color:#34d399;}
  .progress-wrap{height:8px; border-radius:999px; background:var(--panel2); overflow:hidden; margin-bottom:22px; border:1px solid var(--border);}
  #progressBar{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .25s ease;}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px 24px 24px;
    margin-bottom:18px; box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .qnum{font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--accent); text-transform:uppercase; margin-bottom:8px;}
  .qtext{font-size:16.5px; line-height:1.55; margin:0 0 16px; color:#f1f5f9; white-space:pre-line;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; padding:13px 16px; border-radius:11px; border:1.5px solid var(--border);
    background:#0f1a30; color:var(--text); font-size:14.5px; line-height:1.45; cursor:pointer;
    transition:background .15s, border-color .15s, transform .08s; display:flex; gap:10px; align-items:flex-start;
  }
  .opt:hover:not(.locked){border-color:var(--accent); background:#132140;}
  .opt:active:not(.locked){transform:scale(.997);}
  .opt .bullet{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--muted);
    margin-top:1px;
  }
  .opt.locked{cursor:default;}
  .opt.selected-correct{background:var(--correct-bg); color:var(--correct-text); border-color:var(--correct-bg2);}
  .opt.selected-correct .bullet{background:var(--correct-bg2); color:#fff; border-color:var(--correct-bg2);}
  .opt.selected-incorrect{background:var(--incorrect-bg); color:var(--incorrect-text); border-color:#ef4444;}
  .opt.selected-incorrect .bullet{background:#ef4444; color:#fff; border-color:#ef4444;}
  .opt.reveal-correct{background:var(--correct-bg2); color:#fff; border-color:var(--correct-bg2);}
  .opt.reveal-correct .bullet{background:#fff; color:var(--correct-bg2); border-color:#fff;}
  .opt.dim{opacity:.55;}

  .feedback{margin-top:14px; padding:14px 16px; border-radius:11px; font-size:13.5px; line-height:1.6; display:none;}
  .feedback.show{display:block; animation:fadein .2s ease;}
  .feedback.ok{background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.4); color:#bbf7d0;}
  .feedback.bad{background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.4); color:#fecaca;}
  .feedback b{color:#fff;}
  @keyframes fadein{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}

  .tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; margin-left:8px; vertical-align:middle;}
  .tag.correct{background:#22c55e; color:#04240f;}
  .tag.incorrect{background:#ef4444; color:#3a0505;}

  #navRow{display:flex; justify-content:center; gap:14px; margin:26px 0 6px;}
  #navRow button{
    padding:12px 26px; font-size:14px; font-weight:700; border-radius:10px; border:none; cursor:pointer;
    background:var(--accent); color:#fff; transition:filter .15s;
  }
  #navRow button:hover{filter:brightness(1.12);}
  #navRow button:disabled{opacity:.35; cursor:not-allowed;}
  #navRow .ghost{background:var(--panel2); border:1px solid var(--border); color:var(--text);}

  .jump{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px; padding:14px; background:var(--panel); border:1px solid var(--border); border-radius:14px;}
  .jump button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:#0f1a30; color:var(--muted);
    font-size:12px; font-weight:700; cursor:pointer;
  }
  .jump button.current{border-color:var(--accent); color:#fff; background:#1d3a63;}
  .jump button.answered-correct{background:#164a2c; color:#86efac; border-color:#22c55e;}
  .jump button.answered-incorrect{background:#4a1616; color:#fca5a5; border-color:#ef4444;}

  #results{display:none; text-align:center; padding:40px 20px;}
  #results h2{font-size:26px; margin-bottom:6px;}
  #results .big{font-size:52px; font-weight:800; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; margin:14px 0;}
  #results .metrics{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:20px 0 26px;}
  #results .metric{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:16px 22px; min-width:130px;}
  #results .metric .n{font-size:22px; font-weight:800;}
  #results .metric .l{font-size:12px; color:var(--muted); margin-top:4px;}
  #restartBtn{padding:13px 30px; font-size:14px; font-weight:700; border-radius:10px; border:none; background:var(--accent); color:#fff; cursor:pointer;}

  footer{text-align:center; color:var(--muted); font-size:12px; margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Databricks Certified Data Engineer Associate</h1>
      <div class="sub">Practice Quiz &middot; <span id="qCountLabel"></span> questions</div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <div class="stat"><span class="icon">⏱</span><span id="timer">00:00:00</span></div>
      <div class="stat"><span class="icon">✅</span><span id="scoreStat">0 / 0</span></div>
    </div>
  </header>

  <div class="progress-wrap"><div id="progressBar"></div></div>

  <div class="jump" id="jumpNav"></div>

  <div id="quizArea"></div>

  <div id="navRow">
    <button class="ghost" id="prevBtn">&larr; Previous</button>
    <button id="nextBtn">Next &rarr;</button>
    <button class="ghost" id="finishBtn">Finish Quiz</button>
  </div>

  <div id="results">
    <h2>Quiz Complete 🎉</h2>
    <div class="big" id="finalPct">0%</div>
    <div class="metrics">
      <div class="metric"><div class="n" id="mCorrect" style="color:#4ade80;">0</div><div class="l">Correct</div></div>
      <div class="metric"><div class="n" id="mIncorrect" style="color:#f87171;">0</div><div class="l">Incorrect</div></div>
      <div class="metric"><div class="n" id="mUnanswered" style="color:#94a3b8;">0</div><div class="l">Unanswered</div></div>
      <div class="metric"><div class="n" id="mTime" style="color:#fbbf24;">00:00:00</div><div class="l">Time Taken</div></div>
    </div>
    <button id="restartBtn">Restart Quiz</button>
  </div>

  <footer>Self-contained practice quiz &middot; questions sourced &amp; validated from Databricks Data Engineer Associate practice material</footer>
</div>

<script>
const QUIZ_DATA = [{"q": "What is the purpose of using schema_of_json in SQL?", "options": ["To validate the structure of a JSON string.", "To generate a schema that can be used to parse a JSON string into a struct.", "To create a new JSON string from a struct.", "To compress the JSON data for storage efficiency."], "correct": 1, "correctReason": "schema_of_json analyzes a JSON string and returns its inferred schema, which can then be used with functions like from_json to parse JSON data into a structured format (structs/columns). It is particularly useful for dynamically inferring and applying schema definitions on semi-structured data.", "wrong": {"0": "schema_of_json does not validate JSON; it only infers a schema. Validation would require parsing and error handling, not schema inference.", "2": "Creating a new JSON string from a struct is the job of to_json, not schema_of_json.", "3": "Compression is handled at the storage layer (Parquet, Delta, gzip, etc.), not by schema_of_json."}}, {"q": "Which benefit is offered by utilizing array functions in Spark SQL?", "options": ["The capability to process complex, hierarchical data structures sourced from JSON documents.", "The capability to manipulate data across specific partitions and window frames.", "The capability to interact with a collection of tables for streamlined automation.", "The capability to manage time-based data over defined periods.", "The capability to handle multiple data types simultaneously."], "correct": 0, "correctReason": "Array functions in Spark SQL are designed to enhance handling of complex, nested data types typical of JSON files, letting users extract elements, transform array contents, and aggregate directly on complex data without flattening it first.", "wrong": {"1": "That describes window functions, not array functions.", "2": "Array functions operate on array columns, not on collections of tables.", "3": "Time-based data over defined periods is handled by date/time functions, not array functions.", "4": "Array functions work on a single array element type, not multiple data types at once."}}, {"q": "What distinguishes a materialized view from a standard database view?", "options": ["There is no difference; both are terms used interchangeably in the context of database management.", "A materialized view automatically updates in real-time as the underlying data changes, whereas a standard view requires manual refresh.", "A materialized view stores the output of a query physically on disk, whereas a standard view does not store any data but provides a virtual view based on a query.", "A materialized view can only be used in relational databases, while a standard view is specific to NoSQL databases."], "correct": 2, "correctReason": "The key difference is physical storage: a materialized view persists query results on disk, improving performance for read-heavy operations, while a standard view re-executes the underlying query dynamically each time it's accessed.", "wrong": {"0": "They are not interchangeable; the storage behavior differs significantly.", "1": "It's the opposite: materialized views require a refresh (scheduled or manual) to reflect underlying changes; they don't update in true real-time by default.", "3": "Both concepts exist across relational and other systems; this isn't a NoSQL-vs-relational distinction."}}, {"q": "Which data type is typically involved when using the explode function?", "options": ["BOOLEAN", "STRING", "ARRAY", "INTEGER"], "correct": 2, "correctReason": "The explode function operates on ARRAY data types, taking each element within an array and producing a new row for it in the result set.", "wrong": {"0": "explode has no special relationship with BOOLEAN values.", "1": "explode does not operate on plain STRING columns.", "3": "explode does not operate on plain INTEGER columns."}}, {"q": "Which function is typically used to convert a JSON string into a struct in SQL?", "options": ["JSON_TO_STRUCT", "CAST_AS_STRUCT", "FROM_JSON", "TO_STRUCT"], "correct": 2, "correctReason": "FROM_JSON parses a JSON string and converts it into a struct data type, allowing the data to be accessed as if it were a regular row in a table.", "wrong": {"0": "JSON_TO_STRUCT is not a valid Spark SQL function.", "1": "CAST_AS_STRUCT is not a valid Spark SQL function for this purpose.", "3": "TO_STRUCT is not the function used for parsing JSON strings; from_json is."}}, {"q": "A data engineering team at a retail company uses Databricks for analyzing sales data. The team needs to generate a weekly report that includes insights into sales performance across various regions, with data aggregated from millions of transactions stored in Delta Lake. The query to generate this report is complex and time-consuming, leading to delays. To improve efficiency, the team decides to implement a strategy that mirrors the concept of a materialized view within the Databricks environment. Which of the following strategies would best achieve this objective?", "options": ["Create a new Delta Lake table that pre-aggregates the sales data on a daily basis and query this table for the weekly report.", "Directly query the transactional data each time the report is needed, ensuring the most up-to-date information is used.", "Increase the compute resources of the Databricks cluster before running the weekly report to reduce execution time.", "Store the query results in a blob storage and update it manually every month to ensure data freshness."], "correct": 0, "correctReason": "Pre-aggregating sales data into a new Delta Lake table mimics a materialized view: the report queries the smaller, pre-computed table instead of reprocessing the full dataset, and the table can be refreshed on a schedule (e.g., daily) via Databricks Jobs.", "wrong": {"1": "Querying the raw transactional data every time keeps freshness but does nothing to reduce the complex, time-consuming computation \u2014 the opposite of what's needed.", "2": "More compute reduces execution time somewhat but doesn't address the repeated recomputation of the same aggregation, unlike a materialized-view approach.", "3": "Manual monthly updates in blob storage don't provide the near-real-time refresh a weekly report needs and isn't a scalable, automated strategy."}}, {"q": "Given a table named 'events' with a column 'items' that contains an array of values, which SQL query would transform each item of the array into a separate row?", "options": ["SELECT user_id, event_timestamp, event_name, ARRAY(items) AS item FROM events;", "SELECT user_id, event_timestamp, event_name, items FROM events;", "SELECT user_id, event_timestamp, event_name, explode(items) AS item FROM events;", "SELECT user_id, event_timestamp, event_name, UNNEST(items) AS item FROM events;"], "correct": 2, "correctReason": "explode(items) turns each element of the items array into its own row, which is exactly what's needed to flatten an array column into multiple rows.", "wrong": {"0": "ARRAY(items) would wrap items in another array rather than flattening it into rows.", "1": "Selecting items directly just returns the array as-is in a single row per record; it does not create one row per element.", "3": "UNNEST is not valid Spark SQL syntax; Spark SQL uses explode() for this purpose."}}, {"q": "What SQL data type should be used to store an ordered collection of multiple names in a table?", "options": ["MAP", "STRUCT", "VARCHAR", "ARRAY"], "correct": 3, "correctReason": "An ARRAY data type is suitable for storing an arbitrary, ordered collection of elements of the same data type \u2014 such as a list of names as strings.", "wrong": {"0": "MAP stores key-value pairs, not a simple ordered collection of names.", "1": "STRUCT groups fields of potentially different types under named keys; it isn't meant for an ordered list of like items.", "2": "VARCHAR can only hold a single string value, not a collection of names."}}, {"q": "A data engineer wants to create a relational object by pulling data from two tables. The relational object does not need to be used by other data engineers in other sessions. In order to save on storage costs, the data engineer wants to avoid copying and storing physical data. Which of the following relational objects should the data engineer create?", "options": ["View", "Delta Table", "Database", "Temporary View", "Spark SQL Table"], "correct": 3, "correctReason": "A temporary view lets the engineer combine data from two tables without persisting it, and it's only available for the current session \u2014 matching the requirement that it not be used by others or stored long-term.", "wrong": {"0": "A regular (permanent) view is still visible to other users/sessions, which isn't required here.", "1": "A Delta Table physically stores data, which contradicts the goal of avoiding storage costs.", "2": "A database is a namespace/container for objects, not a relational object built from a query.", "4": "A standard Spark SQL table is persisted and generally visible beyond the current session."}}, {"q": "Which of the following SQL keywords can be used to convert a table from a long format to a wide format?", "options": ["TRANSFORM", "PIVOT", "CONVERT", "SUM", "WHERE"], "correct": 1, "correctReason": "PIVOT rotates unique values from one column into multiple columns in the output, transforming data from long format to wide format \u2014 ideal for summary reports.", "wrong": {"0": "TRANSFORM is not a SQL keyword for reshaping tables in this way.", "2": "CONVERT is used for data type conversion, not table reshaping.", "3": "SUM is an aggregate function, not a reshaping keyword.", "4": "WHERE filters rows; it doesn't reshape columns."}}, {"q": "A data engineer is working on a project that involves analyzing a large dataset using Spark SQL. To facilitate the analysis, they create a temporary view of the dataset for preliminary exploration. After creating the temporary view in their current Spark session, they attempt to access this view from a different Spark session for further analysis. Why is the data engineer unable to access the temporary view from a different Spark session?", "options": ["The network connection between the two Spark sessions was lost, preventing access to the temporary view.", "Temporary views are automatically deleted after a certain period, and the time limit was exceeded.", "The data engineer did not correctly create the temporary view, resulting in an error when trying to access it from another session.", "Temporary views require special permissions to be accessed from different sessions.", "Temporary views in Spark SQL are session-scoped and cannot be accessed from different sessions."], "correct": 4, "correctReason": "Temporary views are session-scoped by design \u2014 they exist only for the duration of the session that created them. To share a view across sessions, a global temporary view must be used instead.", "wrong": {"0": "This isn't a network issue; it's a scoping property of temporary views by design.", "1": "Temporary views aren't deleted by a time limit; they simply don't outlive their creating session.", "2": "There's no indication of a creation error; the behavior described is expected for any correctly created temporary view.", "3": "It's not about permissions \u2014 session-scoped views are architecturally invisible to other sessions regardless of permissions."}}, {"q": "When querying data from a JSON file in Databricks SQL, what prefix should be included after the FROM keyword?", "options": ["json", "JSON", "FILE", "TEXT"], "correct": 0, "correctReason": "In Databricks SQL, querying directly from a JSON file uses the lowercase json. prefix, e.g. SELECT * FROM json.`/mnt/data/sample.json`.", "wrong": {"1": "Databricks SQL requires the lowercase json prefix; file-format prefixes are case-sensitive in this context.", "2": "There is no FILE prefix in Databricks SQL \u2014 file formats must be explicitly named (json, csv, parquet, etc.).", "3": "TEXT is not a valid prefix for querying JSON files."}}, {"q": "What syntax does Spark SQL use to query subfields within STRUCT data types?", "options": ["Dot (.)", "Semicolon (;)", "Comma (,)", "Colon (:)"], "correct": 0, "correctReason": "Spark SQL uses dot notation to access subfields inside a STRUCT, e.g. SELECT person.name, person.address.city FROM people;", "wrong": {"1": "Semicolons terminate SQL statements; they aren't used to access subfields.", "2": "Commas separate columns in a SELECT clause; they aren't used to query subfields.", "3": "Colons aren't valid Spark SQL syntax for accessing STRUCT fields (though they appear in contexts like JSONPath)."}}, {"q": "When querying data from a CSV file in Databricks SQL, what prefix should be included after the FROM keyword to correctly interpret the source as a CSV file?", "options": ["CSV", "csv", "TEXT", "FILE"], "correct": 1, "correctReason": "Databricks SQL requires the lowercase csv prefix when querying a file directly by format, e.g. SELECT * FROM csv.`/mnt/data/myfile.csv`.", "wrong": {"0": "Uppercase CSV is not recognized as a valid file-format identifier; the prefix must be lowercase.", "2": "TEXT is not a supported file-format prefix for CSV data in Databricks SQL.", "3": "FILE is not a valid format prefix; the actual file type must be specified (csv, json, etc.)."}}, {"q": "A data engineer working in Databricks wants to create a User-Defined Function (UDF) to convert temperatures from Celsius to Fahrenheit for a dataset containing global weather information. Which of the following best describes the steps they should take to accomplish this within a Databricks notebook?", "options": ["Export the dataset to a CSV file, convert the temperatures using an external tool, and then re-import the dataset into Databricks.", "Create a UDF in Databricks that applies the conversion formula and use it in a Spark SQL query to transform the temperature column.", "Use a built-in Spark SQL function that automatically converts temperatures from Celsius to Fahrenheit.", "Directly modify the dataset in the data lake to convert all temperatures to Fahrenheit before importing it into Databricks."], "correct": 1, "correctReason": "Creating a UDF (e.g., celsius * 9/5 + 32) and registering it lets the conversion run directly within Spark SQL/PySpark queries \u2014 an efficient, scalable approach native to Databricks.", "wrong": {"0": "Exporting and using an external tool is inefficient and bypasses Databricks' native processing capabilities entirely.", "2": "There is no built-in Spark SQL function that automatically performs this specific unit conversion.", "3": "Modifying raw data in the lake before import is not a scalable or repeatable transformation strategy compared to a UDF."}}, {"q": "What is the primary role of a 'Driver' in a cluster environment?", "options": ["To control access to the data storage.", "To manage cloud storage.", "To distribute workloads across workers.", "To serve as the primary compute instance for executing code."], "correct": 2, "correctReason": "The Driver node orchestrates a Spark application: it parses code, builds the execution plan, and distributes tasks across worker nodes, coordinating the cluster.", "wrong": {"0": "Data storage access is managed through connectors, permissions, and security configuration, not the driver.", "1": "Cloud storage management is handled by the cloud provider and integration services, not the driver.", "3": "While the driver runs the main program logic, the heavy computational lifting is done by worker nodes, not the driver acting as the primary compute engine."}}, {"q": "A data engineer aims to implement custom logic on the string column city in the location table for a particular scenario. To efficiently apply this custom logic across the dataset, the engineer plans to establish a SQL user-defined function (UDF). Which code snippet correctly defines this SQL UDF?", "options": ["CREATE FUNCTION combine_california (city STRING) RETURNS STRING RETURN CASE WHEN city = 'San Francisco' THEN 'California' ELSE city END;", "CREATE UDF combine_california (city STRING) RETURN CASE WHEN city = 'San Francisco' THEN 'California' ELSE city END;", "CREATE FUNCTION combine_california (city STRING) RETURN CASE WHEN city = 'San Francisco' THEN 'California' ELSE city END;", "CREATE FUNCTION combine_california (city STRING) RETURNS STRING CASE WHEN city = 'San Francisco' THEN 'California' ELSE city END;", "CREATE UDF combine_california (city STRING) RETURNS STRING RETURN CASE WHEN city = 'San Francisco' THEN 'California' ELSE city END;"], "correct": 0, "correctReason": "Databricks SQL requires CREATE FUNCTION (not CREATE UDF), an explicit RETURNS STRING clause declaring the output type, and a valid RETURN clause containing the logic.", "wrong": {"1": "CREATE UDF is invalid syntax in Databricks SQL, and this option also omits the RETURNS clause.", "2": "CREATE FUNCTION is valid here, but this option is missing the required RETURNS STRING clause.", "3": "This omits the RETURN keyword before the CASE statement, making the syntax invalid.", "4": "CREATE UDF is not supported in Databricks SQL, even though RETURNS STRING is present."}}, {"q": "A data analyst has developed a query against a Delta table. The data engineering team (using Python/PySpark) must implement tests to ensure the query returns clean data. Which operation could the data engineering team use to run the query and operate with the results in PySpark?", "options": ["There is no way to share data between PySpark and SQL.", "spark.sql", "spark.delta.table", "spark.table", "SELECT * FROM sales"], "correct": 1, "correctReason": "spark.sql() lets PySpark users run SQL queries directly in Python notebooks, returning the result as a DataFrame that can then be tested and validated with Python logic \u2014 the standard bridge between SQL and PySpark.", "wrong": {"0": "PySpark fully supports SQL queries via spark.sql(); data moves seamlessly between SQL and Python environments.", "2": "There is no spark.delta.table method; Delta tables are accessed via spark.read.format('delta') or spark.table().", "3": "spark.table() loads a named table into a DataFrame but does not execute an arbitrary SQL query like the analyst's.", "4": "This is just a raw SQL string; without wrapping it in spark.sql(), it cannot run in PySpark."}}, {"q": "Scenario: A data engineer needs to decide between using a temporary view and implementing a strategy akin to a materialized view for a data transformation task. The task involves aggregating large volumes of data from various sources to create a comprehensive dashboard. The dashboard needs to be updated daily with data that has minimal latency.", "options": ["Implement a materialized view-like strategy for both the dashboard and historical data analysis to reduce the computational load on the Databricks cluster.", "Implement a materialized view-like strategy for the dashboard to ensure quick access to pre-aggregated data, and use a temporary view for ad-hoc, real-time analysis tasks that do not require data persistence.", "Use a temporary view for both the dashboard and historical data analysis to maximize data freshness and minimize storage costs.", "Use a temporary view for the dashboard to ensure data is always up-to-date with real-time transformations, and implement a materialized view-like strategy for historical data analysis where data latency is acceptable."], "correct": 1, "correctReason": "Dashboards need fast access to pre-aggregated data with minimal latency, which a materialized-view-like strategy with daily refreshes provides. Temporary views suit ad-hoc, real-time queries where persistence isn't required \u2014 this combination balances performance and flexibility.", "wrong": {"0": "Using a materialized-view-like strategy for all historical analysis too is unnecessary and adds storage/maintenance overhead.", "2": "Temporary views don't persist and require recomputation each time, leading to poor performance for a dashboard over large datasets.", "3": "This misplaces the use cases: dashboards need low-latency pre-aggregation (which temp views can't give), not real-time recomputation."}}, {"q": "Which of the following is stored in the Databricks customer's cloud account?", "options": ["Repos", "Cluster management metadata", "Data", "Databricks web application", "Notebooks"], "correct": 2, "correctReason": "In the Databricks architecture, customer data always resides in the customer's own cloud account (AWS, Azure, or GCP); Databricks provides the platform and services, but data stays in customer-managed storage.", "wrong": {"0": "Repos are stored and managed within the Databricks control plane, not the customer's cloud account.", "1": "Cluster management metadata lives in the Databricks control plane, not the customer's cloud account.", "3": "The Databricks web application is part of the control plane, hosted and managed by Databricks.", "4": "Notebooks are stored in the Databricks control plane, not the customer's cloud account."}}, {"q": "A data analyst has established a Delta table named sales that the entire data analysis team utilizes. They are seeking assistance from the data engineering team to conduct a series of tests to verify the cleanliness of the data. The data engineering team, however, prefers Python for their testing instead of SQL. Which command could the data engineering team use to access the sales table in PySpark?", "options": ["SELECT * FROM sales", "spark.delta.table('sales')", "spark.sql('SELECT * FROM sales')", "Data sharing between PySpark and SQL is not possible.", "spark.table('sales')"], "correct": 4, "correctReason": "spark.table('sales') loads the Delta table directly into a PySpark DataFrame, which is the standard PySpark method for accessing a registered table \u2014 matching the team's preference to work in Python without writing SQL.", "wrong": {"0": "This is a raw SQL statement, not a PySpark command; it can't run directly in Python code.", "1": "There is no spark.delta.table method; Delta tables are accessed via spark.table() or DeltaTable.forName().", "2": "This works, but it's still SQL executed within PySpark rather than a direct, Python-native table access \u2014 spark.table() better fits the stated preference for Python.", "3": "PySpark and SQL are fully interoperable in Databricks; tables move freely between them."}}, {"q": "Which of the following best describes the difference between Gold tables and Silver tables?", "options": ["Gold tables are more likely to contain a less refined view of data than Silver tables.", "Gold tables are more likely to contain aggregations than Silver tables.", "Gold tables are more likely to contain more data than Silver tables.", "Gold tables are more likely to contain valuable data than Silver tables.", "Gold tables are more likely to contain truthful data than Silver tables."], "correct": 1, "correctReason": "In the Medallion Architecture, Silver tables hold cleaned and conformed data, while Gold tables typically summarize or aggregate that data into business-level metrics for reporting and analytics.", "wrong": {"0": "It's the opposite \u2014 Gold tables are more refined than Silver, not less.", "2": "Gold tables usually contain less data due to aggregation/summarization; Silver holds more detailed, row-level data.", "3": "'Valuable' is subjective \u2014 both layers are valuable; the real distinction is aggregation and refinement level.", "4": "Truthfulness isn't the distinguishing factor; both layers aim for accuracy, they differ in refinement/aggregation."}}, {"q": "Which benefit is offered by Delta Lake within the Databricks Lakehouse Platform?", "options": ["The capability to execute complex data operations at scale", "The capability to handle both batch and streaming data processing tasks", "The capability to configure notifications for when queries do not execute successfully", "The capability for collaboration within a single notebook", "The capability to work with the same dataset across multiple programming languages"], "correct": 1, "correctReason": "Delta Lake provides a unified storage layer with ACID transactions, enabling seamless handling of both batch and streaming workloads \u2014 real-time ingestion alongside consistent batch analytics.", "wrong": {"0": "Complex operations at scale come from Spark/Databricks generally, not a unique Delta Lake benefit.", "2": "Delta Lake has no built-in notification mechanism; monitoring/alerting is handled by other services.", "3": "Notebook collaboration is a Databricks workspace feature, not a Delta Lake (storage/transaction layer) feature.", "4": "Multi-language support comes from Apache Spark/Databricks, not specifically from Delta Lake."}}, {"q": "Assuming you have a Delta Lake table named customer_purchases that contains duplicate records based on customer_id. You want to deduplicate these records by keeping only the latest purchase record for each customer based on a purchase_date. How would you use the MERGE statement in Databricks SQL to achieve this?", "options": ["MERGE INTO customer_purchases AS target USING (SELECT customer_id, MAX(purchase_date) AS latest_purchase_date FROM customer_purchases GROUP BY customer_id) AS source ON target.customer_id = source.customer_id WHEN MATCHED AND target.purchase_date < source.latest_purchase_date THEN DELETE WHEN NOT MATCHED THEN INSERT *;", "MERGE INTO customer_purchases AS target USING customer_purchases AS source ON target.customer_id = source.customer_id WHEN MATCHED AND target.purchase_date < source.purchase_date THEN DELETE;", "MERGE INTO customer_purchases AS target USING (SELECT customer_id, purchase_date FROM customer_purchases WHERE purchase_date = (SELECT MAX(purchase_date) FROM customer_purchases GROUP BY customer_id)) AS source ON target.customer_id = source.customer_id WHEN MATCHED THEN UPDATE SET target.* = source.* WHEN NOT MATCHED THEN INSERT *;", "MERGE INTO customer_purchases AS target USING (SELECT customer_id, MAX(purchase_date) AS latest_purchase_date FROM customer_purchases GROUP BY customer_id) AS source ON target.customer_id = source.customer_id AND target.purchase_date < source.latest_purchase_date WHEN MATCHED THEN DELETE;"], "correct": 3, "correctReason": "This compares each record's purchase_date against the latest purchase_date per customer_id (via the aggregated source) and deletes rows where the target's date is older, leaving only the newest record per customer \u2014 the most efficient dedup approach here.", "wrong": {"0": "The INSERT * clause is invalid/unnecessary here; the rows already exist, so only deleting older duplicates is needed.", "1": "Comparing rows within the same table without aggregating by MAX(purchase_date) risks deleting valid records since it doesn't isolate the latest purchase per customer.", "2": "The nested subquery syntax is malformed, and target.* = source.* is invalid SQL syntax in Databricks."}}, {"q": "Consider the following Databricks Spark SQL code snippet. What does this code accomplish?\nCREATE OR REPLACE TEMPORARY VIEW daily_sales AS SELECT date, SUM(amount) AS total_sales FROM sales GROUP BY date;\nCREATE OR REPLACE GLOBAL TEMP VIEW global_daily_sales AS SELECT * FROM daily_sales;", "options": ["Creates a Temporary View daily_sales and a Global Temporary View global_daily_sales with the same data, but global_daily_sales can be accessed in any session within the application.", "Creates a Materialized View daily_sales that is stored on disk and a Global Temporary View global_daily_sales that is stored in memory.", "Throws an error because a Global Temporary View cannot be created from a Temporary View.", "Creates two identical views, daily_sales and global_daily_sales, both of which are accessible across multiple Spark sessions and applications."], "correct": 0, "correctReason": "CREATE OR REPLACE TEMPORARY VIEW creates a session-scoped view (daily_sales); CREATE OR REPLACE GLOBAL TEMP VIEW creates global_daily_sales in the global_temp database, accessible across sessions within the same Spark application.", "wrong": {"1": "Spark SQL does not create materialized views this way; temporary views are in-memory only for the session, never persisted to disk.", "2": "Spark SQL allows creating a Global Temporary View from a query referencing a Temporary View \u2014 no error is thrown.", "3": "daily_sales is session-scoped and is not accessible across sessions; only global_daily_sales is."}}, {"q": "What limitation does Databricks Notebooks have regarding version control integration compared to Databricks Repos?", "options": ["Notebooks have built-in conflict resolution tools that Repos lack.", "Notebooks support direct integration with all major version control systems, while Repos do not.", "Repos allow for full Git integration, including branching and merging, which is not directly supported within Notebooks.", "Notebooks can only be linked to a single branch in a Git repository, whereas Repos can be linked to multiple branches simultaneously."], "correct": 2, "correctReason": "Databricks Notebooks only provide basic version history (auto-saved snapshots), without Git workflows like branching, merging, or pull requests. Repos integrate directly with Git providers, enabling full version control workflows \u2014 the key limitation of Notebooks by comparison.", "wrong": {"0": "Notebooks don't have conflict resolution tools; that's handled by the Git provider when using Repos.", "1": "It's the opposite \u2014 Notebooks lack direct Git integration, while Repos are built for Git workflows.", "3": "Notebooks cannot be linked to Git branches at all; they're limited to internal version history."}}, {"q": "What are the two main components of the Data Plane in Databricks Workspace and Services?", "options": ["Notebooks, Repos, DBSQL", "Workflow Manager and Jobs", "Workspace clusters and SQL Warehouses", "Metastore and Access Control"], "correct": 2, "correctReason": "The Data Plane is where actual computation and query execution happen. Workspace clusters handle distributed processing/ML/ETL workloads, and SQL Warehouses provide query execution for BI/analytics \u2014 together forming the Data Plane's compute backbone.", "wrong": {"0": "Notebooks, Repos, and DBSQL are development interfaces/control-plane-adjacent components, not the compute Data Plane itself.", "1": "Workflow orchestration and job scheduling are control-plane functions; they manage but don't perform compute.", "3": "The metastore and access control are metadata/governance services, not part of the Data Plane compute layer."}}, {"q": "What is the impact of terminating a cluster in Databricks?", "options": ["Terminating a cluster archives all its data and configurations for future retrieval.", "Terminating a cluster removes all user access permissions and configurations permanently.", "Terminating a cluster permanently deletes all data stored in the cluster's associated storage.", "Terminating a cluster releases the compute resources but retains the data in attached storage, allowing for data persistence."], "correct": 3, "correctReason": "Terminating a cluster stops/releases the compute resources (VMs/instances), but data stored in Databricks-managed or attached storage (like DBFS or mounted cloud storage) is not deleted, ensuring data persistence for future use. Only temporary local-storage data is lost.", "wrong": {"0": "Termination doesn't 'archive' data as a distinct process; the underlying attached data simply persists on its own.", "1": "User access permissions and configurations are not wiped by terminating a cluster.", "2": "Data in attached/managed storage is not deleted on termination \u2014 only ephemeral local storage is lost."}}, {"q": "What is a key difference between all-purpose clusters and job clusters in Databricks?", "options": ["All-purpose clusters can only run SQL commands, while job clusters can run commands in multiple languages.", "All-purpose clusters do not support autoscaling, whereas job clusters do.", "All-purpose clusters are designed for interactive analysis by multiple users, whereas job clusters are optimized for running specific jobs and are terminated after the job is complete.", "Job clusters are permanent and cannot be terminated, unlike all-purpose clusters."], "correct": 2, "correctReason": "All-purpose clusters support interactive, multi-user work such as exploratory analysis in notebooks. Job clusters are created for a specific job/batch process and are automatically terminated once the job completes, optimizing resource usage and cost.", "wrong": {"0": "Both cluster types support multiple languages; this isn't a SQL-only vs multi-language distinction.", "1": "Both cluster types can support autoscaling; that's not the defining difference.", "3": "It's the opposite \u2014 job clusters are ephemeral and terminate after the job, while all-purpose clusters persist until manually stopped."}}, {"q": "How do Databricks Notebooks and Repos differ in terms of file size limitations for version control?", "options": ["Notebooks allow for larger file sizes in version control than Repos.", "Both Notebooks and Repos have the same file size limitations for version control.", "Notebooks have no file size limitations, while Repos have a strict limit.", "Repos support larger file sizes for version control compared to Notebooks."], "correct": 3, "correctReason": "Repos are designed for more efficient version control integration with Git and generally handle larger project files better than the built-in versioning available directly within Notebooks.", "wrong": {"0": "This is the opposite of how the two features are designed to behave.", "1": "The two do not share identical limitations; Repos are built for more robust file/version handling.", "2": "Notebooks are not limitation-free; their native versioning is more constrained than Repos' Git-based approach."}}, {"q": "If you are analyzing data in a Databricks notebook using Python, how can you switch to SQL for a specific visualization task?", "options": ["Use the %sql magic command in a new cell where you want to start using SQL.", "Export the data to a SQL database and create a new SQL notebook.", "Rewrite the Python code in SQL and run it in a new Python cell.", "Convert the entire notebook to SQL mode from the notebook settings."], "correct": 0, "correctReason": "The %sql magic command switches the execution context to SQL for that specific cell, letting users leverage SQL for querying/visualization directly within a multi-language notebook.", "wrong": {"1": "Exporting to a separate SQL database and notebook is unnecessary; magic commands allow switching languages in place.", "2": "SQL code doesn't belong in a 'Python cell' \u2014 you'd use a %sql cell instead of rewriting SQL to run as Python.", "3": "There's no need to convert the whole notebook; magic commands let you mix languages cell by cell."}}, {"q": "What is the role of a storage credential in Databricks' Unity Catalog?", "options": ["To restrict access to data based on user roles.", "To provide encryption for data at rest.", "To ensure data is backed up across multiple regions.", "To enable Unity Catalog to connect to an external cloud storage."], "correct": 3, "correctReason": "A storage credential authenticates and authorizes Unity Catalog to access external cloud storage services such as AWS S3 or Azure Storage, allowing Unity Catalog to manage and interact with data stored there.", "wrong": {"0": "Restricting access by role is handled by Unity Catalog's access control/grants, not the storage credential itself.", "1": "Encryption at rest is a storage-layer/cloud-provider concern, not the function of a storage credential.", "2": "Cross-region backup is a storage/replication feature, not what a storage credential provides."}}, {"q": "A data team is evaluating their infrastructure needs to enhance their reporting workflows. They are considering the adoption of cluster pools within their Databricks environment. In which scenario would a data team most benefit from implementing cluster pools?", "options": ["To guarantee the reproducibility of an automated report.", "To conduct error detection tests on an automated report.", "An automated report needs to be refreshed as quickly as possible.", "To manage version control for an automated report with multiple contributors.", "To enable all stakeholders to execute an automated report."], "correct": 2, "correctReason": "Cluster pools keep pre-warmed instances ready, significantly reducing cluster start-up time \u2014 ideal when speed and responsiveness are critical, such as refreshing a report as fast as possible.", "wrong": {"0": "Reproducibility relates to consistent code/data/config, not cluster start-up speed.", "1": "Error detection testing is a software-quality practice unrelated to cluster warm-up time.", "3": "Version control with multiple contributors is a Git/Repos concern, not a cluster-pools concern.", "4": "Enabling stakeholder access is a permissions/sharing concern, not something cluster pools address."}}, {"q": "When integrating the Unity Catalog with existing systems, what is a key advantage?", "options": ["It requires a complete overhaul of existing data catalogs.", "It necessitates the use of Databricks-exclusive storage systems.", "It operates solely on non-standard SQL variants for legacy systems.", "It works in concert with existing data, storage, and catalogs, without the need for hard migration."], "correct": 3, "correctReason": "Unity Catalog is designed to integrate seamlessly with existing infrastructure, working alongside current data solutions, storage systems, and catalogs without requiring a complex, resource-intensive migration.", "wrong": {"0": "It specifically avoids requiring a complete overhaul; that's the opposite of its design goal.", "1": "It does not require Databricks-exclusive storage; it works with existing cloud storage.", "2": "It uses standard SQL, not a non-standard variant, to remain broadly compatible."}}, {"q": "What is the purpose of Data Access Control within Data Governance?", "options": ["To automate the data ingestion process.", "To monitor the performance of data processing jobs.", "To ensure that data processing is as fast as possible.", "To control who has access to which data within the Databricks environment."], "correct": 3, "correctReason": "Data Access Control manages permissions and access rights so only authorized users can access specific datasets, aligning with fine-grained access controls across notebooks, tables, and clusters.", "wrong": {"0": "Automating ingestion is an ETL/orchestration concern, not access control.", "1": "Monitoring job performance is an observability concern, not access control.", "2": "Processing speed is a performance concern, unrelated to who can access what data."}}, {"q": "What is the purpose of an 'External Location' in Databricks?", "options": ["It is used to log the performance metrics of the Databricks runtime environment.", "It refers to a cloud storage path combined with storage credentials to access specific data.", "It is a dedicated space for Delta Live Tables.", "It is a location where Databricks stores its internal metadata."], "correct": 1, "correctReason": "An External Location is a configured cloud storage path paired with the appropriate storage credentials, enabling fine-grained, governed access to specific locations in external cloud storage.", "wrong": {"0": "Performance metric logging is unrelated to what an External Location represents.", "2": "External Locations aren't specific to Delta Live Tables; they're a general Unity Catalog storage-access construct.", "3": "Databricks' own internal metadata storage is not what an External Location refers to."}}, {"q": "What is the role of Data Lineage in Databricks' Data Governance?", "options": ["To capture upstream sources and downstream consumers of data.", "To replicate data across multiple cloud providers.", "To compress data for efficient storage.", "To convert data into different formats automatically."], "correct": 0, "correctReason": "Data Lineage provides visibility into a dataset's lifecycle \u2014 its origin, transformations, and where it moves over time \u2014 crucial for understanding data flow, ensuring quality, and troubleshooting pipeline issues.", "wrong": {"1": "Cross-cloud replication is a storage/DR concern, not what lineage tracks.", "2": "Compression is a storage-efficiency concern, unrelated to lineage.", "3": "Automatic format conversion is unrelated to tracking a dataset's origin and movement."}}, {"q": "How can users filter clusters in Databricks to view only those that are accessible to them?", "options": ["By contacting the Databricks administrator to receive a custom list of clusters that the user has access to.", "By using the Databricks CLI to manually list all clusters and applying filters based on user permissions.", "By navigating to the Clusters UI in Databricks and using the built-in filtering options to display only the clusters they have permissions to access.", "By executing a specific SQL query in Databricks SQL Analytics to retrieve a list of accessible clusters based on the user's role."], "correct": 2, "correctReason": "The Clusters UI includes built-in filtering options that let users view only the clusters they're authorized to access, as part of Databricks' secure, user-centric design.", "wrong": {"0": "Contacting an admin manually is unnecessary; the UI already provides this filtering natively.", "1": "Manually scripting this via CLI is far more cumbersome than the built-in UI filters.", "3": "There's no dedicated SQL Analytics query for cluster access; cluster visibility is managed through the Clusters UI, not SQL."}}, {"q": "How can you enable collaborative editing of a Databricks notebook by multiple team members within your organization?", "options": ["Assign the notebook to  "correct": 0, "correctReason": "Restarting a Databricks cluster applies configuration changes \u2014 such as updated Spark configurations or newly installed cluster-level libraries \u2014 and can also clear temporary glitches or memory issues affecting performance.", "wrong": {"1": "Downgrading the Spark version requires reconfiguring/recreating the cluster with a different runtime, not a simple restart.", "2": "Restarting doesn't change attached storage capacity; that's a separate storage configuration change.", "3": "This restates the general idea but is less precise than applying configuration/library changes, which is the primary, well-documented reason."}}, {"q": "Your organization runs multiple data engineering projects simultaneously, each requiring different cluster configurations and sizes. To optimize resource utilization across these projects, you're considering the use of Cluster Pools. How would Cluster Pools facilitate better resource utilization across multiple projects in this scenario?", "options": ["By enabling projects to share a common pool of instances, improving overall resource utilization.", "By allowing each project to have its dedicated pool, preventing resource sharing.", "By providing a fixed number of instances that can only be used by the highest priority project.", "By locking specific instances to specific projects, based on the project's budget."], "correct": 0, "correctReason": "Cluster Pools let multiple projects share a common pool of pre-warmed instances, allowing idle resources to be dynamically allocated across projects as needed \u2014 improving efficiency and reducing costs versus dedicated, potentially underutilized resources per project.", "wrong": {"1": "Dedicated pools per project would prevent sharing, defeating the purpose of pooling for utilization gains.", "2": "Reserving instances solely for the highest-priority project doesn't improve utilization across all projects.", "3": "Locking instances to specific projects by budget removes the flexible sharing that makes pools effective."}}, {"q": "Which job uses a Gold table as its source?", "options": ["A job that cleans data by removing malformatted records", "A job that enriches data by parsing its timestamps into a human-readable format", "A job that queries aggregated data designed to feed into a dashboard", "A job that ingests raw data from a streaming source into the Lakehouse", "A job that aggregates uncleaned data to create standard summary statistics"], "correct": 2, "correctReason": "Gold tables contain refined, cleaned, and aggregated data ready for analytics and reporting. A job querying aggregated data to feed a dashboard requires exactly that level of curated, analysis-ready data.", "wrong": {"0": "Cleaning malformatted records is typically a Bronze-to-Silver step, not a job consuming Gold data.", "1": "Parsing timestamps into readable format is a Silver-layer enrichment task, not a Gold-table consumer.", "3": "Ingesting raw streaming data lands in the Bronze layer, not Gold.", "4": "Aggregating uncleaned data isn't Gold-table behavior \u2014 Gold data is already cleaned before aggregation."}}, {"q": "In which of the following file formats is data from Delta Lake tables primarily stored?", "options": ["Delta", "JSON", "A proprietary, optimized format specific to Databricks", "Parquet"], "correct": 3, "correctReason": "Delta Lake tables primarily store data in the open-source, columnar Parquet format, adding a layer of ACID transactions, scalable metadata handling, and schema enforcement on top of it.", "wrong": {"0": "'Delta' describes the transactional log/table format layer, not the underlying file format the data is stored in.", "1": "JSON is not the underlying storage format for Delta Lake data files.", "2": "Delta Lake is built on the open Parquet format, not a proprietary Databricks-only file format."}}, {"q": "What level of access does a Metastore Admin have in the Databricks Unity Catalog?", "options": ["They can manage users and groups as well as integrate with IdP.", "They can create or drop, grant privileges on, and change the ownership of catalogs and other data objects.", "They can only view metadata and user management settings.", "They have full access to all data objects."], "correct": 1, "correctReason": "The Metastore Admin role has a focused scope centered on data catalog management: creating/dropping catalogs and data objects, granting privileges, and changing ownership \u2014 not unrestricted access to all data.", "wrong": {"0": "User/group management and IdP integration are typically account/workspace admin responsibilities, not the Metastore Admin's core scope.", "2": "The role can actively manage objects (create, drop, grant, change ownership), not just view metadata.", "3": "Full access to all data objects overstates the role; it's scoped to catalog-level administrative tasks, not blanket data access."}}, {"q": "How can you execute Python and SQL code within the same Databricks notebook?", "options": ["By installing a special library that allows cross-language execution.", "By configuring the notebook settings to enable multi-language support before execution.", "By writing all code in Python and using API calls to execute SQL queries.", "By using the %python and %sql magic commands at the beginning of each cell to specify the language."], "correct": 3, "correctReason": "Databricks notebooks support multiple languages within the same notebook via magic commands (%python, %sql, etc.) that specify the language per cell, without needing extra configuration or libraries.", "wrong": {"0": "No special library installation is needed; this is a built-in notebook feature.", "1": "No prior settings configuration is required; language switching is done per-cell via magic commands.", "2": "You don't need to route everything through Python API calls; %sql cells can run SQL directly."}}, {"q": "A data engineer is evaluating whether to utilize the native versioning feature of Databricks Notebooks or to manage their project with Databricks Repos. What is a benefit of opting for Databricks Repos instead of the built-in versioning of Databricks Notebooks?", "options": ["Databricks Repos allows for commenting on specific alterations.", "Databricks Repos ensures continuous saving of work in progress.", "Databricks Repos offers the option to go back to earlier versions of a notebook.", "Databricks Repos enables working with multiple branches.", "Databricks Repos operates entirely within the Databricks Lakehouse ecosystem."], "correct": 3, "correctReason": "The key advantage of Repos over built-in Notebook versioning is support for multiple branches, enabling teams to work on different features/experiments in parallel \u2014 a full Git-like workflow with branching and merging.", "wrong": {"0": "Commenting on changes is more a Git-provider/PR feature, not the defining Repos-vs-Notebooks benefit here.", "1": "Continuous auto-saving is actually a feature of Notebooks' built-in versioning, not a distinguishing Repos benefit.", "2": "Reverting to earlier versions is already possible with Notebooks' built-in versioning; branching is what Repos uniquely adds.", "4": "Repos actually integrate with external Git providers (GitHub, GitLab, etc.) rather than operating solely within the Databricks ecosystem."}}, {"q": "Which of the following can be used to simplify and unify siloed data architectures that are specialized for specific use cases?", "options": ["All of these", "Data lake", "Data warehouse", "Data lakehouse", "None of these"], "correct": 3, "correctReason": "A data lakehouse combines the scalable storage of a data lake with the data management and ACID transaction features of a data warehouse, letting organizations handle diverse data types and use cases within one unified architecture.", "wrong": {"0": "'All of these' is incorrect because a data lake or data warehouse alone doesn't unify both concerns the way a lakehouse does.", "1": "A data lake alone lacks the strong data management/ACID guarantees needed to fully unify siloed architectures.", "2": "A data warehouse alone lacks the scalable, flexible storage for diverse/unstructured data that a lake provides.", "4": "The lakehouse architecture specifically addresses this need, so 'none of these' is incorrect."}}, {"q": "A data engineer has a Python variable table_name that they would like to use in a SQL query. They want to construct a Python code block that will run the query using table_name. They have the following incomplete code block: ____(f\"SELECT customer_id, spend FROM {table_name}\") Which of the following can be used to fill in the blank to successfully complete the task?", "options": ["spark.delta.sql", "spark.sql", "dbutils.sql", "spark.delta.table", "spark.table"], "correct": 1, "correctReason": "spark.sql() executes a SQL query string from within Python, offering a flexible way to leverage SQL while working in a Python-centric workflow \u2014 exactly what's needed to run the f-string query.", "wrong": {"0": "There is no spark.delta.sql method in PySpark.", "2": "There is no dbutils.sql method for executing SQL query strings.", "3": "spark.delta.table is not a valid method; it doesn't exist in PySpark.", "4": "spark.table() loads a table by name; it doesn't execute an arbitrary SQL query string like the one given."}}, {"q": "What is the primary use of the PIVOT clause in Spark SQL?", "options": ["To split a single column into multiple columns based on column values.", "To perform aggregation and convert rows into columns, transforming data from a long format to a wide format.", "To filter rows based on a specified condition.", "To merge multiple rows into a single row by creating a wider table with more columns."], "correct": 1, "correctReason": "PIVOT performs row-to-column transformations, aggregating data and rotating rows into columns \u2014 converting long-format data into wide-format data, useful for summary tables and analysis.", "wrong": {"0": "This describes splitting a column, which isn't what PIVOT fundamentally does \u2014 it reshapes rows into columns based on aggregation.", "2": "Filtering rows is the job of WHERE, not PIVOT.", "3": "This is close but imprecise; PIVOT specifically aggregates and reshapes based on distinct values, not just merging arbitrary rows."}}, {"q": "A data engineering team is tasked with automating a Spark SQL query that compiles monthly sales data. The query is designed to access a table named in the format monthly_sales_YYYYMM, where YYYYMM denotes the year and month of the sales data. The automation needs to ensure that each execution of the query targets the table for the month preceding the current one. Considering the requirement for the query to adapt monthly to access data from the previous month, which strategy should the data engineering team employ?", "options": ["Develop a PySpark script that calculates the date for the previous month and dynamically inserts this date into the table name within the query string.", "Revise the database design to consolidate sales data into a single table with a month column, avoiding the necessity for separate monthly tables.", "Propose altering the query's execution frequency to quarterly, thereby reducing the need for monthly table name updates.", "Manually update the table name in the query to reflect the previous month's data before executing it each time."], "correct": 0, "correctReason": "Using PySpark with Python's datetime functionality to compute the previous month and dynamically build the table name (e.g., monthly_sales_202302) automates the query without manual intervention, reducing errors and ensuring timely access to the right table.", "wrong": {"1": "While a redesign could help long-term, it doesn't answer the immediate automation requirement for the existing table-per-month structure.", "2": "Changing the frequency to quarterly doesn't meet the stated requirement of monthly execution against the previous month's table.", "3": "Manual updates are exactly what the automation is meant to eliminate \u2014 this defeats the purpose of automating the process."}}, {"q": "Which statement correctly describes the difference between a Temporary View and a Global Temporary View?", "options": ["There is no difference; both Temporary and Global Temporary Views have the same scope and visibility across Spark sessions.", "Temporary Views can be created on disk, making them persistent across Spark sessions, whereas Global Temporary Views are in-memory only and lost after the session ends.", "Temporary Views are stored in the Hive metastore and are accessible across all sessions, whereas Global Temporary Views are session-scoped and not stored in the Hive metastore.", "Temporary Views are session-scoped and cannot be accessed by other Spark sessions, whereas Global Temporary Views are accessible across multiple Spark sessions within the same Spark application."], "correct": 3, "correctReason": "Temporary Views are tied to a single Spark session and invisible to other sessions, while Global Temporary Views are visible across all sessions of a Spark application but are not stored in the Hive metastore.", "wrong": {"0": "They do differ significantly in scope; this option incorrectly claims no difference.", "1": "Neither is created on disk; both are in-memory constructs \u2014 this option reverses/misstates their persistence.", "2": "Neither is stored in the Hive metastore; this option incorrectly attributes metastore storage to Temporary Views."}}, {"q": "A data engineer tries to remove a Spark SQL table named my_table with the intention of erasing both the table's metadata and its data. They execute the command: DROP TABLE IF EXISTS my_table; After running this command, my_table no longer shows up in the list of tables, but the data files remain. What explains the persistence of the data files despite the deletion of the metadata?", "options": ["The table's data exceeded 10 GB", "The table was specified without a location.", "The table's data was under 10 GB.", "The table was a managed table.", "The table was set up as an external table."], "correct": 4, "correctReason": "When you drop a managed table, Spark deletes both metadata and data files. But dropping an external table only removes the metadata, leaving the data files untouched \u2014 since the data files persisted, the table must have been external.", "wrong": {"0": "Data size has no bearing on whether DROP TABLE removes the underlying files.", "1": "The behavior described relates to managed vs. external table status, not whether a location was specified.", "2": "Data size has no bearing on whether DROP TABLE removes the underlying files.", "3": "If it were a managed table, both metadata and data would have been deleted \u2014 contradicting the observed persistence of the data files."}}];
</script>
<script>
(function(){
  const state = {
    idx: 0,
    answers: new Array(QUIZ_DATA.length).fill(null), // {selected, correct}
    startTime: Date.now(),
    finished: false,
    timerInterval: null
  };

  const quizArea = document.getElementById('quizArea');
  const jumpNav = document.getElementById('jumpNav');
  const progressBar = document.getElementById('progressBar');
  const timerEl = document.getElementById('timer');
  const scoreStat = document.getElementById('scoreStat');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const finishBtn = document.getElementById('finishBtn');
  const resultsEl = document.getElementById('results');
  const qCountLabel = document.getElementById('qCountLabel');

  qCountLabel.textContent = QUIZ_DATA.length;

  function fmtTime(ms){
    const s = Math.floor(ms/1000);
    const hh = String(Math.floor(s/3600)).padStart(2,'0');
    const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    return hh+':'+mm+':'+ss;
  }

  function startTimer(){
    state.timerInterval = setInterval(()=>{
      if(!state.finished){
        timerEl.textContent = fmtTime(Date.now()-state.startTime);
      }
    }, 1000);
  }

  function updateScoreStat(){
    const correctCount = state.answers.filter(a=>a && a.correct).length;
    const answeredCount = state.answers.filter(a=>a).length;
    scoreStat.textContent = correctCount + ' / ' + answeredCount + ' answered';
  }

  function buildJumpNav(){
    jumpNav.innerHTML = '';
    QUIZ_DATA.forEach((q,i)=>{
      const b = document.createElement('button');
      b.textContent = i+1;
      b.title = 'Question ' + (i+1);
      b.addEventListener('click', ()=>{ state.idx = i; render(); });
      jumpNav.appendChild(b);
    });
    refreshJumpNav();
  }

  function refreshJumpNav(){
    const btns = jumpNav.querySelectorAll('button');
    btns.forEach((b,i)=>{
      b.classList.remove('current','answered-correct','answered-incorrect');
      if(i===state.idx) b.classList.add('current');
      const a = state.answers[i];
      if(a){
        b.classList.add(a.correct ? 'answered-correct' : 'answered-incorrect');
      }
    });
  }

  function updateProgress(){
    const answeredCount = state.answers.filter(a=>a).length;
    progressBar.style.width = (answeredCount/QUIZ_DATA.length*100) + '%';
  }

  function letter(i){ return String.fromCharCode(65+i); }

  function render(){
    const q = QUIZ_DATA[state.idx];
    const existing = state.answers[state.idx];

    let html = '';
    html += '<div class="card">';
    html += '<div class="qnum">Question ' + (state.idx+1) + ' of ' + QUIZ_DATA.length + '</div>';
    html += '<div class="qtext">' + escapeHtml(q.q) + '</div>';
    html += '<div class="options" id="optionsHost"></div>';
    html += '<div class="feedback" id="feedbackHost"></div>';
    html += '</div>';
    quizArea.innerHTML = html;

    const optionsHost = document.getElementById('optionsHost');
    q.options.forEach((optText, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="bullet">' + letter(i) + '</span><span>' + escapeHtml(optText) + '</span>';
      btn.addEventListener('click', () => selectOption(i));
      optionsHost.appendChild(btn);
    });

    if(existing){
      lockAndReveal(existing.selected);
    }

    updateProgress();
    updateScoreStat();
    refreshJumpNav();
    prevBtn.disabled = state.idx===0;
    nextBtn.textContent = state.idx===QUIZ_DATA.length-1 ? 'Next →' : 'Next →';
    nextBtn.disabled = state.idx===QUIZ_DATA.length-1;
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function selectOption(i){
    if(state.answers[state.idx]) return; // already answered, locked
    const q = QUIZ_DATA[state.idx];
    const isCorrect = (i === q.correct);
    state.answers[state.idx] = { selected: i, correct: isCorrect };
    lockAndReveal(i);
    updateProgress();
    updateScoreStat();
    refreshJumpNav();
  }

  function lockAndReveal(selectedIdx){
    const q = QUIZ_DATA[state.idx];
    const opts = document.querySelectorAll('#optionsHost .opt');
    opts.forEach((btn,i)=>{
      btn.classList.add('locked');
      if(i === q.correct && i !== selectedIdx){
        btn.classList.add('reveal-correct');
      }
      if(i === selectedIdx){
        btn.classList.add(q.correct===selectedIdx ? 'selected-correct' : 'selected-incorrect');
      }
      if(i !== selectedIdx && i !== q.correct){
        btn.classList.add('dim');
      }
    });

    const fb = document.getElementById('feedbackHost');
    const isCorrect = selectedIdx === q.correct;
    fb.classList.add('show');
    if(isCorrect){
      fb.classList.add('ok');
      fb.innerHTML = '<span class="tag correct">CORRECT</span><br><br>' + escapeHtml(q.correctReason);
    } else {
      fb.classList.add('bad');
      const wrongReason = q.wrong[String(selectedIdx)] || 'This option does not match the correct behavior described in the reference material.';
      fb.innerHTML =
        '<span class="tag incorrect">INCORRECT</span><br><br>' +
        '<b>Why your answer is wrong:</b> ' + escapeHtml(wrongReason) +
        '<br><br><b>Why the correct answer (' + letter(q.correct) + ') is right:</b> ' + escapeHtml(q.correctReason);
    }
  }

  prevBtn.addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; render(); }
  });
  nextBtn.addEventListener('click', ()=>{
    if(state.idx<QUIZ_DATA.length-1){ state.idx++; render(); }
  });
  finishBtn.addEventListener('click', finishQuiz);

  function finishQuiz(){
    state.finished = true;
    clearInterval(state.timerInterval);
    const totalTime = Date.now() - state.startTime;
    const correctCount = state.answers.filter(a=>a && a.correct).length;
    const incorrectCount = state.answers.filter(a=>a && !a.correct).length;
    const unanswered = QUIZ_DATA.length - correctCount - incorrectCount;
    const pct = Math.round((correctCount/QUIZ_DATA.length)*100);

    document.getElementById('finalPct').textContent = pct + '%';
    document.getElementById('mCorrect').textContent = correctCount;
    document.getElementById('mIncorrect').textContent = incorrectCount;
    document.getElementById('mUnanswered').textContent = unanswered;
    document.getElementById('mTime').textContent = fmtTime(totalTime);

    quizArea.style.display = 'none';
    document.getElementById('navRow').style.display = 'none';
    jumpNav.style.display = 'none';
    resultsEl.style.display = 'block';
    timerEl.textContent = fmtTime(totalTime);
  }

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state.idx = 0;
    state.answers = new Array(QUIZ_DATA.length).fill(null);
    state.startTime = Date.now();
    state.finished = false;
    clearInterval(state.timerInterval);
    startTimer();
    quizArea.style.display = '';
    document.getElementById('navRow').style.display = '';
    jumpNav.style.display = '';
    resultsEl.style.display = 'none';
    render();
  });

  buildJumpNav();
  render();
  startTimer();
})();
</script>
</body>
</html>
